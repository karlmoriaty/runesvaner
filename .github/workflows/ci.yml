name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Run RAG sample
        run: dotnet samples/Runesvaner.Sample.Rag/bin/Release/net10.0/Runesvaner.Sample.Rag.dll

      - name: Report RAG capture
        run: dotnet src/Runesvaner.Cli/bin/Release/net10.0/Runesvaner.Cli.dll report

      - name: Validate example price table
        run: dotnet src/Runesvaner.Cli/bin/Release/net10.0/Runesvaner.Cli.dll pricing validate --path pricing/example-prices.json

      - name: Validate built-in price table
        run: dotnet src/Runesvaner.Cli/bin/Release/net10.0/Runesvaner.Cli.dll pricing validate --builtin

      - name: Report cost ledger
        run: dotnet src/Runesvaner.Cli/bin/Release/net10.0/Runesvaner.Cli.dll costs

  perf-gate:
    name: perf-gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build benchmarks
        run: dotnet build test/Runesvaner.Benchmarks/Runesvaner.Benchmarks.csproj -c Release

      - name: Run performance gate
        run: dotnet test/Runesvaner.Benchmarks/bin/Release/net10.0/Runesvaner.Benchmarks.dll --gate

  aot-smoke:
    name: aot-smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Native AOT sample
        run: dotnet publish samples/Runesvaner.Sample.Aot/Runesvaner.Sample.Aot.csproj -c Release -r win-x64 --self-contained true

      - name: Run Native AOT sample
        run: .\samples\Runesvaner.Sample.Aot\bin\Release\net10.0\win-x64\publish\Runesvaner.Sample.Aot.exe

      - name: Report AOT capture
        run: dotnet run --project src/Runesvaner.Cli -c Release -- report

  aot-smoke-linux:
    name: aot-smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT sample
        run: dotnet publish samples/Runesvaner.Sample.Aot/Runesvaner.Sample.Aot.csproj -c Release -r linux-x64 --self-contained true

      - name: Run Native AOT sample
        run: ./samples/Runesvaner.Sample.Aot/bin/Release/net10.0/linux-x64/publish/Runesvaner.Sample.Aot

      - name: Report AOT capture
        run: dotnet run --project src/Runesvaner.Cli -c Release -- report

  pack:
    name: pack (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Runesvaner.sln -c Release

      - name: Pack
        run: dotnet pack Runesvaner.sln -c Release --no-build -o artifacts/packages

      - name: Verify package set
        run: |
          if ls artifacts/packages/Runesvaner.Sample.* >/dev/null 2>&1; then
            echo "Sample projects must not be packed." >&2
            exit 1
          fi

          for id in Runesvaner.Abstractions Runesvaner.Extensions.DependencyInjection Runesvaner.Http Runesvaner.Exporters.OpenTelemetry Runesvaner.MicrosoftExtensionsAI Runesvaner.SemanticKernel Runesvaner.VectorData Runesvaner.Storage.Jsonl Runesvaner.Storage.Sqlite Runesvaner; do
            test -f "artifacts/packages/$id.0.3.0-alpha.1.nupkg" || { echo "Missing package $id" >&2; exit 1; }
          done

      - name: Verify package readme
        run: |
          for package in artifacts/packages/*.nupkg; do
            unzip -l "$package" | grep -q "README.md" || { echo "Missing README in $package" >&2; exit 1; }
          done

  studio-ui:
    name: studio-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Runesvaner.Studio.UI/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix src/Runesvaner.Studio.UI

      - name: Build UI
        run: npm run build --prefix src/Runesvaner.Studio.UI

      - name: Build Studio
        run: dotnet build src/Runesvaner.Studio/Runesvaner.Studio.csproj -c Release

  docs-site:
    name: docs-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix docs-site

      - name: Build site
        run: npm run build --prefix docs-site
